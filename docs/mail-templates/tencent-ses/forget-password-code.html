<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码验证码</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#111827;">
  <div style="max-width:640px;margin:0 auto;padding:32px 16px;">
    <div style="background:#ffffff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 12px 32px rgba(15,23,42,0.08);">
      <div style="padding:28px 32px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#ffffff;">
        <div style="font-size:14px;letter-spacing:0.08em;text-transform:uppercase;opacity:.85;">Password Reset</div>
        <h1 style="margin:10px 0 0;font-size:24px;line-height:1.35;">找回密码验证码</h1>
      </div>
      <div style="padding:32px;">
        <p style="margin:0 0 16px;font-size:16px;line-height:1.8;">您好，您正在申请重置账号密码。请使用以下验证码继续完成密码重置：</p>
        <div style="margin:28px 0;padding:22px 16px;text-align:center;background:#faf5ff;border:1px dashed #c4b5fd;border-radius:14px;">
          <div style="font-size:36px;line-height:1;font-weight:800;letter-spacing:8px;color:#6d28d9;">{{code}}</div>
        </div>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.8;color:#4b5563;">验证码有效期为 {{ttl_minutes}} 分钟。密码重置完成后，旧登录状态可能会失效。</p>
        <p style="margin:0;font-size:14px;line-height:1.8;color:#6b7280;">如果不是您本人发起，请不要输入该验证码，并立即检查账号安全。</p>
      </div>
      <div style="padding:18px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:13px;line-height:1.7;">本邮件由系统自动发送，请勿直接回复。</div>
    </div>
  </div>
</body>
</html>
