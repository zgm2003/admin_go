<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{app_name}} 绑定邮箱验证码</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#1f2937;">
  <div style="max-width:640px;margin:0 auto;padding:32px 16px;">
    <div style="background:#ffffff;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 12px 32px rgba(15,23,42,0.08);">
      <div style="padding:28px 32px;background:linear-gradient(135deg,#059669,#0ea5e9);color:#ffffff;">
        <div style="font-size:14px;letter-spacing:0.08em;text-transform:uppercase;opacity:.85;">Email Binding</div>
        <h1 style="margin:10px 0 0;font-size:24px;line-height:1.35;">{{app_name}} 绑定邮箱验证码</h1>
      </div>
      <div style="padding:32px;">
        <p style="margin:0 0 16px;font-size:16px;line-height:1.8;">您好，您正在为 {{app_name}} 账号绑定或更换邮箱。请在页面中输入以下验证码确认邮箱归属：</p>
        <div style="margin:28px 0;padding:22px 16px;text-align:center;background:#ecfdf5;border:1px dashed #6ee7b7;border-radius:14px;">
          <div style="font-size:36px;line-height:1;font-weight:800;letter-spacing:8px;color:#047857;">{{code}}</div>
        </div>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.8;color:#4b5563;">验证码有效期为 {{ttl_minutes}} 分钟。绑定成功后，该邮箱可用于账号安全验证和通知接收。</p>
        <p style="margin:0;font-size:14px;line-height:1.8;color:#6b7280;">如果这不是您本人操作，请忽略本邮件。</p>
      </div>
      <div style="padding:18px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:13px;line-height:1.7;">本邮件由 {{app_name}} 系统自动发送，请勿直接回复。</div>
    </div>
  </div>
</body>
</html>
